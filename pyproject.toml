[project]
name = "hebrew-tts-data-tools"
version = "0.1.0"
description = "Reusable Hebrew text normalization, aligned-audio segmentation, quality filtering, and dataset auditing tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio",
    "pandas",
    "datasets",
    "pydub",
    "pyyaml",
    "soundfile",
    "tqdm",
    "numpy",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
